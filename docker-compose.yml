services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flowguard
      POSTGRES_USER: flowguard
      POSTGRES_PASSWORD: flowguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  flowguard:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/flowguard
      DB_USERNAME: flowguard
      DB_PASSWORD: flowguard
      # Point this at your Airflow webserver's REST API.
      AIRFLOW_URL: ${AIRFLOW_URL:-http://host.docker.internal:8080}
      AIRFLOW_USER: ${AIRFLOW_USER:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    ports:
      - "8088:8088"
